<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
  </head>
  <body>
    <pre id="out"></pre>
    <script>
      // Chips in the flat style of shields.io, measured here so they can live in the repository: GitHub's image
      // proxy times out on badge services often enough that a README chip from one shows as a broken image.
      const CHIPS = [
        { file: "homebrew", label: "Homebrew", value: "ertembiyik/tap/xcslot", color: "#f38020" },
        { file: "macos", label: "macOS", value: "Apple silicon | Intel", color: "#0a84ff" },
        { file: "license", label: "License", value: "MIT", color: "#4c1" },
      ];
      const ctx = document.createElement("canvas").getContext("2d");
      ctx.font = "11px Verdana";
      const width = (text) => Math.round(ctx.measureText(text).width) + 10;
      const escape = (text) => text.replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
      const svg = ({ label, value, color }) => {
        const l = width(label),
          v = width(value),
          w = l + v;
        return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="20" role="img" aria-label="${escape(label)}: ${escape(value)}"><title>${escape(label)}: ${escape(value)}</title><linearGradient id="s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="r"><rect width="${w}" height="20" rx="3" fill="#fff"/></clipPath><g clip-path="url(#r)"><rect width="${l}" height="20" fill="#555"/><rect x="${l}" width="${v}" height="20" fill="${color}"/><rect width="${w}" height="20" fill="url(#s)"/></g><g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11"><text x="${l / 2}" y="15" fill="#010101" fill-opacity=".3">${escape(label)}</text><text x="${l / 2}" y="14">${escape(label)}</text><text x="${l + v / 2}" y="15" fill="#010101" fill-opacity=".3">${escape(value)}</text><text x="${l + v / 2}" y="14">${escape(value)}</text></g></svg>\n`;
      };
      document.getElementById("out").textContent = JSON.stringify(
        CHIPS.map((chip) => ({ file: chip.file, svg: svg(chip) })),
      );
    </script>
  </body>
</html>
