<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #000;
        --fg: #f5f5f7;
        --axis-label: #6e6e73;
        --axis-note: #48484a;
        --axis: #3a3a3c;
        --grey-line: #6e6e73;
        --display: -apple-system, "SF Pro Display", BlinkMacSystemFont, system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
      }
      body {
        width: 1600px;
        height: 900px;
        font-family: var(--display);
        -webkit-font-smoothing: antialiased;
      }
      svg {
        display: block;
      }
      .title {
        font-size: 64px;
        font-weight: 600;
        letter-spacing: -0.02em;
        fill: var(--fg);
      }
      .end {
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.01em;
        fill: var(--fg);
      }
      .axis-title {
        font-size: 40px;
        font-weight: 600;
        letter-spacing: -0.015em;
        fill: var(--axis-label);
      }
      .axis-note {
        font-size: 24px;
        font-weight: 600;
        fill: var(--axis-note);
      }
    </style>
  </head>
  <body>
    <svg id="chart" width="1600" height="900" viewBox="0 0 1600 900"></svg>
    <script>
      // Total xcodebuild time as fresh worktrees arrive, from the measured figures in docs/benchmarks.md:
      // every plain build is cold (85 s); through xcslot each of the three slots builds cold once, then 4.8 s.
      const COLD = 85,
        WARM = 4.8,
        SLOTS = 3,
        N = 12;
      const plain = Array.from({ length: N + 1 }, (_, n) => [n, COLD * n]);
      const slotted = Array.from({ length: N + 1 }, (_, n) => [
        n,
        COLD * Math.min(n, SLOTS) + WARM * Math.max(0, n - SLOTS),
      ]);

      const box = { left: 300, right: 1500, top: 150, bottom: 760 };
      const yMax = COLD * N * 1.04;
      const x = (n) => box.left + 40 + (n / N) * (box.right - box.left - 120);
      const y = (s) => box.bottom - 30 - (s / yMax) * (box.bottom - box.top - 40);

      // Straight runs joined by one rounded corner at the third slot, so the curve bends without overshooting.
      const at = (pts, n) => pts.find(([k]) => k === n)[1];
      const lerp = (n) => (n <= SLOTS ? COLD * n : COLD * SLOTS + WARM * (n - SLOTS));
      const plainPath = `M${x(0)},${y(0)} L${x(N)},${y(at(plain, N))}`;
      const before = SLOTS - 0.7,
        after = SLOTS + 1.2;
      const slottedPath = `M${x(0)},${y(0)} L${x(before)},${y(lerp(before))} Q${x(SLOTS)},${y(lerp(SLOTS))} ${x(after)},${y(lerp(after))} L${x(N)},${y(lerp(N))}`;

      const last = (pts) => [x(pts.at(-1)[0]), y(pts.at(-1)[1])];
      const [px, py] = last(plain),
        [sx, sy] = last(slotted);
      document.getElementById("chart").innerHTML = `
    <defs>
      <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#5e5ce6"/><stop offset="0.55" stop-color="#0a84ff"/><stop offset="1" stop-color="#64d2ff"/>
      </linearGradient>
    </defs>
    <text class="title" x="800" y="92" text-anchor="middle">Build Time vs. Worktrees</text>
    <line x1="${box.left}" y1="${box.top}" x2="${box.left}" y2="${box.bottom}" stroke="var(--axis)" stroke-width="3"/>
    <line x1="${box.left}" y1="${box.bottom}" x2="${box.right}" y2="${box.bottom}" stroke="var(--axis)" stroke-width="3"/>
    <path d="${plainPath}" fill="none" stroke="var(--grey-line)" stroke-width="9" stroke-linecap="round"/>
    <path d="${slottedPath}" fill="none" stroke="url(#hot)" stroke-width="9" stroke-linecap="round"/>
    <text class="end" x="${px - 10}" y="${py - 30}" text-anchor="end">Plain xcodebuild</text>
    <text class="end" x="${sx}" y="${sy - 30}" text-anchor="end">xcslot</text>
    <text class="axis-title" x="${box.left - 34}" y="${(box.top + box.bottom) / 2}" text-anchor="end">Time</text>
    <text class="axis-title" x="${box.left - 34}" y="${(box.top + box.bottom) / 2 + 46}" text-anchor="end">building</text>
    <text class="axis-note" x="${box.left - 34}" y="${(box.top + box.bottom) / 2 + 84}" text-anchor="end">Lower is better</text>
    <text class="axis-title" x="${(box.left + box.right) / 2}" y="${box.bottom + 62}" text-anchor="middle">Fresh worktrees</text>
    <text class="axis-note" x="${(box.left + box.right) / 2}" y="${box.bottom + 98}" text-anchor="middle">One per agent task</text>`;
    </script>
  </body>
</html>
