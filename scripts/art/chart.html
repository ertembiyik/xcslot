<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --fg: #1d1d1f;
        --muted: #6e6e73;
        --track: #e8e8ed;
        --bar: #b0b0b8;
        --hot: #ff8a00;
        --hot-2: #ff5e00;
        --line: #d2d2d7;
        --display: -apple-system, "SF Pro Display", BlinkMacSystemFont, system-ui, sans-serif;
      }
      body.dark {
        --fg: #f5f5f7;
        --muted: #8e8e93;
        --track: #1f2328;
        --bar: #4a4f57;
        --line: #30363d;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
      }
      body {
        width: 880px;
        height: 250px;
        padding: 22px 8px;
        font-family: var(--display);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
        display: grid;
        grid-template-columns: 250px 1fr;
        gap: 40px;
        align-items: center;
      }
      .stat {
        border-right: 1px solid var(--line);
        padding-right: 36px;
      }
      .big {
        font-size: 92px;
        line-height: 0.92;
        font-weight: 700;
        letter-spacing: -0.045em;
        background: linear-gradient(180deg, #ffb340, var(--hot) 50%, var(--hot-2));
        -webkit-background-clip: text;
        color: transparent;
      }
      .big small {
        font-size: 46px;
        letter-spacing: -0.02em;
      }
      .what {
        margin-top: 12px;
        font-size: 17px;
        line-height: 1.3;
        font-weight: 600;
      }
      .what span {
        display: block;
        color: var(--muted);
        font-weight: 500;
      }
      .rows {
        display: grid;
        gap: 18px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 64px;
        gap: 6px 14px;
        align-items: center;
      }
      .label {
        grid-column: 1 / 3;
        font-size: 15px;
        font-weight: 600;
      }
      .label span {
        color: var(--muted);
        font-weight: 500;
      }
      .track {
        height: 12px;
        border-radius: 6px;
        background: var(--track);
        overflow: hidden;
      }
      .fill {
        height: 100%;
        border-radius: 6px;
        background: var(--bar);
      }
      .fill.hot {
        background: linear-gradient(90deg, var(--hot-2), var(--hot));
        min-width: 12px;
      }
      .val {
        font-size: 17px;
        font-weight: 600;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .val.hot {
        color: var(--hot);
      }
    </style>
  </head>
  <body class="THEME">
    <div class="stat">
      <div class="big">4.8<small> s</small></div>
      <div class="what">First build of a fresh worktree<span>through a warm slot, instead of 85 s</span></div>
    </div>
    <div class="rows">
      <div class="row">
        <div class="label">Its own DerivedData <span>· cold</span></div>
        <div class="track"><div class="fill" style="width: 100%"></div></div>
        <div class="val">85 s</div>
      </div>
      <div class="row">
        <div class="label">Xcode's compilation cache <span>· shared across worktrees</span></div>
        <div class="track"><div class="fill" style="width: 50.6%"></div></div>
        <div class="val">43 s</div>
      </div>
      <div class="row">
        <div class="label">xcslot <span>· warm slot</span></div>
        <div class="track"><div class="fill hot" style="width: 5.6%"></div></div>
        <div class="val hot">4.8 s</div>
      </div>
    </div>
  </body>
</html>
