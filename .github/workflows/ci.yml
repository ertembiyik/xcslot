name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A pull request that touches no code skips test, build and macos: a skipped job passes a required check.
  # They still run when this job fails, so a broken diff never turns into a pass.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && ! git diff --name-only "$BASE" HEAD |
            grep -qE '^(src|test|scripts|skills|\.github/(workflows|scripts))/|^(package\.json|bun\.lock|bunfig\.toml|tsconfig\.json)$'; then
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # One job for the small checks, and it runs all of them so every failure is listed at once.
      # Each has its own time budget and fails when it goes over.
      - name: format, types, reference tables
        run: |
          failed=0
          timeout 1 bun fmt --check || { echo "::error::bun fmt --check failed or took over 1 s"; failed=1; }
          timeout 5 bun check || { echo "::error::bun check failed or took over 5 s"; failed=1; }
          timeout 5 bun scripts/docs.ts --check || { echo "::error::docs/reference.md tables are stale"; failed=1; }
          exit $failed

  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: timeout 30 bun test --randomize

  build:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: timeout 35 bun scripts/build.ts

  # Real xcodebuild, APFS clones and dsymutil. There is no merge queue on a personal account, so this is a
  # required check on the pull request itself; the three jobs above still answer within a minute.
  macos:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test --randomize
      - run: bun test test/e2e.test.ts
        env:
          XCSLOT_E2E: "1"
      - name: the compiled binary on a Mac
        run: |
          bun scripts/build.ts --target host
          ./dist/xcslot doctor
      - name: the Homebrew formula passes brew style
        run: |
          mkdir -p "$RUNNER_TEMP/Formula"
          printf '%064d  xcslot-darwin-arm64\n%064d  xcslot-darwin-x64\n' 0 1 > "$RUNNER_TEMP/checksums.txt"
          sh .github/scripts/formula.sh v0.0.0 "$RUNNER_TEMP/checksums.txt" > "$RUNNER_TEMP/Formula/xcslot.rb"
          brew style "$RUNNER_TEMP/Formula/xcslot.rb"
